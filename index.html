<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasores Musicais - Edição Neon V3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --dark-purple: #1D1135;
            --purple: #462255;
            --magenta: #FF00FF;
            --cyan: #00FFFF;
            --yellow: #F7F48B;
            --light-bg: #87556f;
        }

        body {
            background-color: var(--dark-purple);
            color: var(--cyan);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            padding: 1rem;
            box-sizing: border-box;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
        }

        #info-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 10px 0;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: var(--yellow);
            text-shadow: 2px 2px 0 var(--magenta);
        }

        canvas {
            background-color: #000;
            border: 3px solid var(--cyan);
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(255, 0, 255, 0.4);
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            image-rendering: pixelated;
        }
        
        #modal {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        
        #modal h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--yellow);
            text-shadow: 4px 4px 0 var(--magenta);
        }
        
        #modal p {
             font-size: clamp(1rem, 3vw, 1.5rem);
             margin-top: 0;
             color: var(--cyan);
         }

        #modal button {
            padding: 15px 30px;
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-family: 'Press Start 2P', cursive;
            color: var(--dark-purple);
            background: linear-gradient(45deg, var(--cyan), var(--magenta));
            border: 3px solid var(--yellow);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #990099;
            transition: all 0.1s ease-in-out;
        }
        
        #modal button:active {
            transform: translateY(5px);
            box-shadow: none;
        }
        
         #mobile-controls {
            display: none;  
            flex-direction: row;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 10px 0;
            margin-top: 10px;
        }
        
        .mobile-btn {
            width: 80px;
            height: 80px;
            background-color: var(--purple);
            color: var(--cyan);
            border-radius: 50%;
            border: 2px solid var(--cyan);
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            box-shadow: 0 5px 0 var(--dark-purple);
        }
        
        #mobile-fire {
           width: 100px;
           height: 100px;
           background-color: var(--light-bg);
           border-color: var(--magenta);
           color: var(--magenta);
           box-shadow: 0 5px 0 var(--dark-purple);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="info-bar">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="mobile-controls">
            <div id="move-left" class="mobile-btn">◀</div>
            <div id="mobile-fire" class="mobile-btn">FIRE</div>
            <div id="move-right" class="mobile-btn">▶</div>
        </div>
    </div>
    <div id="modal">
        <h1 id="modal-title">Invasores Musicais</h1>
        <p id="modal-text">Use as setas para mover e Espaço para atirar.</p>
        <button id="start-button">Iniciar Jogo</button>
    </div>

    <script>
        window.onload = () => {
            // --- ELEMENTOS DO DOM ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('score');
            const livesEl = document.getElementById('lives');
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalText = document.getElementById('modal-text');
            const startButton = document.getElementById('start-button');

            // --- CONFIGURAÇÃO DE ÁUDIO (TONE.JS) ---
            let synths = {};
            let toneReady = false;
            try {
                if (typeof Tone !== 'undefined') {
                    // Sintetizadores para vários efeitos
                    synths.playerShoot = new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 0.1 } }).toDestination();
                    synths.invaderDestroyed = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.005, decay: 0.2, sustain: 0, release: 0.2 } }).toDestination();
                    synths.playerHit = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.01, decay: 0.5, sustain: 0, release: 0.5 } }).toDestination();
                    synths.bunkerHit = new Tone.MembraneSynth({ pitchDecay: 0.1, octaves: 2, envelope: { attack: 0.001, decay: 0.3, sustain: 0.01, release: 0.1 } }).toDestination();
                    synths.levelUp = new Tone.Synth().toDestination();
                    synths.gameOver = new Tone.Synth().toDestination();
                    
                    // Sequência rítmica para o movimento dos invasores
                    const moveSynth = new Tone.Synth({ oscillator: { type: 'square' }, volume: -18, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
                    synths.moveSequence = new Tone.Sequence((time, note) => {
                        moveSynth.triggerAttackRelease(note, '16n', time);
                    }, ['C2', 'C#2'], '8n').start(0);

                    // --- NOVO: Trilha sonora grave ---
                    const bassSynth = new Tone.FMSynth({
                        harmonicity: 3,
                        modulationIndex: 10,
                        detune: 0,
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.01, decay: 0.01, sustain: 1, release: 0.5 },
                        modulation: { type: "square" },
                        modulationEnvelope: { attack: 0.5, decay: 0, sustain: 1, release: 0.5 },
                        volume: -15
                    }).toDestination();
                    synths.bassline = new Tone.Sequence((time, note) => {
                        bassSynth.triggerAttackRelease(note, "8n", time);
                    }, ["C1", "G1", "C1", "A1"], "4n").start(0);


                    toneReady = true;
                }
            } catch (e) { console.error("Erro ao inicializar Tone.js:", e); }

            // --- ESTADO E CONFIGURAÇÕES DO JOGO ---
            let score, lives, level;
            let gameActive, animationFrameId, invaderFireInterval;
            let gameState = 'startScreen'; 

            // --- OBJETOS DO JOGO ---
            const player = { x: 0, y: 0, width: 60, height: 30, speed: 7, color: '#00FFFF' }; // Cor Ciano
            const projectile = { width: 6, height: 18, speed: 10, color: '#FF00FF' }; // Cor Magenta
            let playerProjectile = null;
            
            const invader = { width: 30, height: 25 };
            const invaderColors = ['#FF6AC1', '#F7F48B', '#8AFF8A', '#82C0FF', '#B28DFF']; // Cores vivas
            let invaders = [];
            let invaderDirection = 1;
            let invaderSpeed = 0.5;
            let invaderDrop = 15;
            let invaderProjectiles = [];

            let bunkers = []; 
            const keys = { right: false, left: false };
            const MAX_BUNKER_HEALTH = 15; // --- NOVO: Constante para vida máxima

            // --- FUNÇÕES DE CONTROLE DE JOGO ---
            function startNewGame() {
                resizeCanvas();
                score = 0;
                lives = 3;
                level = 1;
                invaderSpeed = 0.5;
                if (toneReady) {
                    Tone.Transport.bpm.value = 100;
                    const now = Tone.now();
                    synths.levelUp.triggerAttackRelease("C4", "8n", now);
                    synths.levelUp.triggerAttackRelease("G4", "8n", now + 0.2);
                }
                startLevel();
            }

            function startLevel() {
                player.x = canvas.width / 2 - player.width / 2;
                playerProjectile = null;
                invaderProjectiles = [];
                createInvaders();
                createBunkers();
                updateHUD();
                
                modal.style.display = 'none';
                gameActive = true;
                gameState = 'playing';

                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (invaderFireInterval) clearInterval(invaderFireInterval);
                
                if (toneReady) Tone.Transport.start();
                invaderFireInterval = setInterval(invaderShoot, 1000 - (level * 50));
                gameLoop();
            }
            
            function levelUp() {
                 gameActive = false;
                 gameState = 'levelComplete';
                 if (toneReady) {
                     Tone.Transport.stop();
                     const now = Tone.now();
                     synths.levelUp.triggerAttackRelease("C5", "8n", now);
                     synths.levelUp.triggerAttackRelease("E5", "8n", now + 0.1);
                     synths.levelUp.triggerAttackRelease("G5", "8n", now + 0.2);
                     synths.levelUp.triggerAttackRelease("C6", "8n", now + 0.3);
                 }
                 level++;
                 invaderSpeed += 0.3;
                 if (toneReady) Tone.Transport.bpm.value += 20;
                 modalTitle.textContent = "NÍVEL COMPLETO!";
                 modalText.innerHTML = `Score: ${score}<br>Prepare-se para o nível ${level}`;
                 startButton.textContent = "Próximo Nível";
                 modal.style.display = 'flex';
             }
            
            function gameOver(message) {
                 gameActive = false;
                 gameState = 'gameOver';
                 if (toneReady) {
                     Tone.Transport.stop();
                     const now = Tone.now();
                     synths.gameOver.triggerAttackRelease("G3", "4n", now);
                     synths.gameOver.triggerAttackRelease("D3", "4n", now + 0.3);
                     synths.gameOver.triggerAttackRelease("C3", "2n", now + 0.6);
                 }
                 if (animationFrameId) cancelAnimationFrame(animationFrameId);
                 if (invaderFireInterval) clearInterval(invaderFireInterval);
                 modal.style.display = 'flex';
                 modalTitle.textContent = message;
                 modalText.textContent = `Score final: ${score}`;
                 startButton.textContent = "Jogar Novamente";
            }

            function gameLoop() {
                if (!gameActive) return;
                update();
                draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            }

            // --- LÓGICA DE CRIAÇÃO DE ELEMENTOS ---
            function createInvaders() {
                invaders = [];
                const rows = 5;
                const cols = 8;
                const startX = (canvas.width - (cols * (invader.width + 15))) / 2;
                const startY = 50;
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        invaders.push({
                            x: startX + col * (invader.width + 15),
                            y: startY + row * (invader.height + 20),
                            color: invaderColors[row % invaderColors.length]
                        });
                    }
                }
            }
            
            function createBunkers() {
                bunkers = [];
                const noteTypes = ['semibreve', 'minima', 'seminima', 'colcheia', 'semicolcheia'];
                const numNotes = noteTypes.length;

                const bunkerWidth = canvas.width / (numNotes * 1.7);
                const bunkerHeight = bunkerWidth * 1.3;
                
                const totalNotesWidth = numNotes * bunkerWidth;
                const spacing = (canvas.width - totalNotesWidth) / (numNotes + 1);
                
                const startY = player.y - 140; 

                for (let i = 0; i < numNotes; i++) {
                    const x = spacing + i * (bunkerWidth + spacing);
                    bunkers.push({
                        x: x, y: startY, width: bunkerWidth, height: bunkerHeight,
                        health: MAX_BUNKER_HEALTH, // --- MUDANÇA: Vida aumentada
                        type: noteTypes[i]
                    });
                }
            }
            
            // --- LÓGICA DE ATUALIZAÇÃO ---
            function update() {
                if (keys.right && player.x < canvas.width - player.width) player.x += player.speed;
                if (keys.left && player.x > 0) player.x -= player.speed;

                if (playerProjectile) {
                    playerProjectile.y -= playerProjectile.speed;
                    if (playerProjectile.y < 0) playerProjectile = null;
                }
                invaderProjectiles.forEach((p, i) => {
                    p.y += p.speed;
                    if (p.y > canvas.height) invaderProjectiles.splice(i, 1);
                });

                let hitWall = false;
                invaders.forEach(inv => {
                    inv.x += invaderSpeed * invaderDirection;
                    if (inv.x <= 0 || inv.x + invader.width >= canvas.width) hitWall = true;
                    if (inv.y + invader.height >= player.y - 10) gameOver("Os invasores chegaram!");
                });
                if (hitWall) {
                    invaderDirection *= -1;
                    invaders.forEach(inv => { inv.y += invaderDrop; });
                }

                collisionDetection();
                if (invaders.length === 0 && gameActive) {
                    levelUp();
                }
            }
            
            function invaderShoot() {
                if (!gameActive || invaders.length === 0) return;
                const shootingInvader = invaders[Math.floor(Math.random() * invaders.length)];
                invaderProjectiles.push({
                    x: shootingInvader.x + invader.width / 2 - projectile.width / 2,
                    y: shootingInvader.y + invader.height,
                    width: 4, height: 12, speed: 5, color: '#F7F48B'
                });
            }
            
            // --- DETECÇÃO DE COLISÃO ---
            function checkCollision(a, b) {
                return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
            }

            function collisionDetection() {
                if (playerProjectile) {
                    for (let i = invaders.length - 1; i >= 0; i--) {
                        if (checkCollision(playerProjectile, { ...invaders[i], ...invader })) {
                            if (toneReady) synths.invaderDestroyed.triggerAttack();
                            invaders.splice(i, 1);
                            playerProjectile = null;
                            score += 10;
                            updateHUD();
                            return; 
                        }
                    }
                    for (let i = bunkers.length - 1; i >= 0; i--) {
                        if (checkCollision(playerProjectile, bunkers[i])) {
                             if(toneReady) synths.bunkerHit.triggerAttackRelease("C2", "8n");
                             bunkers[i].health--;
                             if(bunkers[i].health <= 0) bunkers.splice(i, 1);
                             playerProjectile = null;
                             return;
                        }
                    }
                }
                
                 for (let i = invaderProjectiles.length - 1; i >= 0; i--) {
                    if (checkCollision(invaderProjectiles[i], player)) {
                        invaderProjectiles.splice(i, 1);
                        playerHit();
                        return;
                    }
                     for (let j = bunkers.length - 1; j >= 0; j--) {
                         if(checkCollision(invaderProjectiles[i], bunkers[j])) {
                             if(toneReady) synths.bunkerHit.triggerAttackRelease("C2", "8n");
                             bunkers[j].health--;
                             if(bunkers[j].health <= 0) bunkers.splice(j, 1);
                             invaderProjectiles.splice(i, 1);
                             break; 
                         }
                     }
                 }
            }

            function playerHit() {
                if (toneReady) synths.playerHit.triggerAttackRelease("G2", "8n");
                lives--;
                updateHUD();
                if (lives <= 0) gameOver("Fim de Jogo!");
                else {
                    let originalColor = player.color;
                    player.color = "#FF0000";
                    setTimeout(() => { player.color = originalColor; }, 200);
                }
            }
            
            function updateHUD() {
                scoreEl.textContent = score;
                livesEl.textContent = lives;
            }
            
            // --- FUNÇÕES DE DESENHO ---
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPlayer();
                if(playerProjectile) {
                    ctx.fillStyle = playerProjectile.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = playerProjectile.color;
                    ctx.fillRect(playerProjectile.x, playerProjectile.y, playerProjectile.width, playerProjectile.height);
                    ctx.shadowBlur = 0;
                }
                invaderProjectiles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.shadowBlur = 0;
                });
                invaders.forEach(inv => drawInvader(inv));
                drawBunkers();
            }

            function drawPlayer() {
                ctx.fillStyle = player.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = player.color;
                const p = player;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y + p.height);
                ctx.lineTo(p.x + p.width / 2, p.y);
                ctx.lineTo(p.x + p.width, p.y + p.height);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function drawInvader(inv) {
                const i = { ...inv, ...invader };
                ctx.fillStyle = i.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = i.color;
                ctx.fillRect(i.x, i.y, i.width, i.height);
                ctx.fillStyle = "#000";
                ctx.fillRect(i.x + i.width * 0.2, i.y + i.height * 0.3, i.width * 0.2, i.height * 0.2);
                ctx.fillRect(i.x + i.width * 0.6, i.y + i.height * 0.3, i.width * 0.2, i.height * 0.2);
                ctx.shadowBlur = 0;
            }

            function drawBunkers() {
                bunkers.forEach(bunker => {
                    // --- MUDANÇA: Cor e brilho mais fortes ---
                    const healthPercentage = bunker.health / MAX_BUNKER_HEALTH;
                    const bunkerColor = `rgba(70, 34, 85, ${0.5 + healthPercentage * 0.5})`; // Cor roxa fica mais transparente
                    ctx.fillStyle = bunkerColor;
                    ctx.strokeStyle = bunkerColor;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `rgba(255, 0, 255, ${healthPercentage})`; // Brilho magenta diminui com o dano
                    
                    ctx.lineWidth = bunker.width / 12;
                    
                    const headX = bunker.x + bunker.width / 2;
                    const headY = bunker.y + bunker.height * 0.8;
                    const headRadiusX = bunker.width * 0.3;
                    const headRadiusY = bunker.height * 0.2;
                    const stemHeight = bunker.height * 0.8;
                    const stemWidth = bunker.width * 0.12;

                    switch (bunker.type) {
                        case 'semibreve':
                            ctx.beginPath();
                            ctx.ellipse(headX, headY, headRadiusX, headRadiusY, Math.PI / 1.5, 0, 2 * Math.PI);
                            ctx.stroke();
                            break;
                        case 'minima':
                            ctx.beginPath();
                            ctx.ellipse(headX - headRadiusX * 0.5, headY, headRadiusX, headRadiusY, Math.PI / 1.5, 0, 2 * Math.PI);
                            ctx.stroke();
                            ctx.fillRect(headX + headRadiusX * 0.2, headY, stemWidth, -stemHeight);
                            break;
                        case 'seminima':
                            ctx.beginPath();
                            ctx.ellipse(headX - headRadiusX * 0.5, headY, headRadiusX, headRadiusY, Math.PI / 1.5, 0, 2 * Math.PI);
                            ctx.fill();
                            ctx.fillRect(headX + headRadiusX * 0.2, headY, stemWidth, -stemHeight);
                            break;
                        case 'colcheia':
                            ctx.beginPath();
                            ctx.ellipse(headX - headRadiusX * 0.5, headY, headRadiusX, headRadiusY, Math.PI / 1.5, 0, 2 * Math.PI);
                            ctx.fill();
                            const stemX = headX + headRadiusX * 0.2;
                            const stemTopY = headY - stemHeight;
                            ctx.fillRect(stemX, headY, stemWidth, -stemHeight);
                            ctx.beginPath();
                            ctx.moveTo(stemX + stemWidth, stemTopY);
                            ctx.quadraticCurveTo(stemX + bunker.width * 0.6, stemTopY + bunker.height * 0.1, stemX + stemWidth, stemTopY + bunker.height * 0.45);
                            ctx.lineWidth = bunker.width / 8;
                            ctx.stroke();
                            break;
                        case 'semicolcheia':
                            ctx.beginPath();
                            ctx.ellipse(headX - headRadiusX * 0.5, headY, headRadiusX, headRadiusY, Math.PI / 1.5, 0, 2 * Math.PI);
                            ctx.fill();
                            const scStemX = headX + headRadiusX * 0.2;
                            const scStemTopY = headY - stemHeight;
                            ctx.fillRect(scStemX, headY, stemWidth, -stemHeight);
                            ctx.lineWidth = bunker.width / 10;
                            // Bandeira 1
                            ctx.beginPath();
                            ctx.moveTo(scStemX + stemWidth, scStemTopY);
                            ctx.quadraticCurveTo(scStemX + bunker.width * 0.6, scStemTopY + bunker.height * 0.1, scStemX + stemWidth, scStemTopY + bunker.height * 0.45);
                            ctx.stroke();
                             // Bandeira 2
                            const offset = bunker.height * 0.18;
                            ctx.beginPath();
                            ctx.moveTo(scStemX + stemWidth, scStemTopY + offset);
                            ctx.quadraticCurveTo(scStemX + bunker.width * 0.6, scStemTopY + bunker.height * 0.1 + offset, scStemX + stemWidth, scStemTopY + bunker.height * 0.45 + offset);
                            ctx.stroke();
                            break;
                    }
                    ctx.shadowBlur = 0;
                });
            }
            
            // --- EVENT LISTENERS E CONTROLES ---
            function handleKeyDown(e) {
                if (e.code === 'ArrowRight' || e.key === 'd') keys.right = true;
                if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if (e.code === 'Space') { e.preventDefault(); shoot(); }
            }
            
            function handleKeyUp(e) {
                if (e.code === 'ArrowRight' || e.key === 'd') keys.right = false;
                if (e.code === 'ArrowLeft' || e.key === 'a') keys.left = false;
            }
            
            function shoot() {
                 if (!gameActive || playerProjectile) return;
                 if(toneReady) synths.playerShoot.triggerAttackRelease("G5", "32n");
                 playerProjectile = {
                     x: player.x + player.width / 2 - projectile.width / 2,
                     y: player.y, ...projectile
                 };
            }
            
            function setupMobileControls() {
                if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                    document.getElementById('mobile-controls').style.display = 'flex';
                    const leftBtn = document.getElementById('move-left');
                    const rightBtn = document.getElementById('move-right');
                    const fireBtn = document.getElementById('mobile-fire');
                    leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
                    leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
                    rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
                    rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
                    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
                }
            }
            
            function resizeCanvas() {
                const containerWidth = canvas.parentElement.clientWidth;
                canvas.width = containerWidth;
                canvas.height = containerWidth * (3 / 4);
                player.y = canvas.height - player.height - 10;
                if(gameActive || gameState === 'startScreen') {
                    createBunkers();
                    draw();
                }
            }

            // --- INICIALIZAÇÃO ---
            startButton.addEventListener('click', () => {
                if (toneReady && Tone.context.state !== 'running') {
                    Tone.start().catch(e => console.error("Tone.start() falhou", e));
                }

                if (gameState === 'startScreen' || gameState === 'gameOver') {
                    startNewGame();
                } else if (gameState === 'levelComplete') {
                    startLevel();
                }
            });

            window.addEventListener('resize', resizeCanvas);
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            setupMobileControls();
            resizeCanvas(); 
        };
    </script>

</body>
</html>
